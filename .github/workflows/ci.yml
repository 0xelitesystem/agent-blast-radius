name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: Regenerate demo and run a report
        run: |
          python examples/make_demo.py
          blast-radius report examples/demo-session.jsonl --no-color
        shell: bash
      - name: Demo session must trip the critical gate
        run: "! blast-radius report examples/demo-session.jsonl --no-color --fail-on-critical"
        shell: bash
